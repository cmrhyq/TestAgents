# ============================================================================
# pyproject.toml — TestAgents 项目配置
# 包含：项目元数据、依赖声明、构建系统、开发工具配置
# 参考：https://packaging.python.org/en/latest/specifications/pyproject-toml/
# ============================================================================

# ----------------------------------------------------------------------------
# 构建系统声明
# 使用 hatchling 作为构建后端（轻量、快速、支持动态版本）
# ----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ----------------------------------------------------------------------------
# 项目元数据
# ----------------------------------------------------------------------------
[project]
name = "testagents"
dynamic = ["version"]                # 版本号从 src/__init__.py 动态读取
description = "LLM-driven API automation testing agent — natural language to parse, generate, execute, and report."
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "cmrhyq", email = "cmrhyq@gmail.com" },
]
keywords = ["llm", "api-testing", "automation", "langgraph", "langchain", "openapi", "bedrock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

# ----------------------------------------------------------------------------
# 运行时依赖（pip install testagents 时自动安装）
# ----------------------------------------------------------------------------
dependencies = [
    # LangChain 生态
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-aws>=0.2.0",
    "langgraph>=0.3.0",
    "langchain-chroma>=0.1.2",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-deepseek>=1.1.0",
    "langchain-litellm>=0.6.6",
    # LLM 提供商 SDK
    "litellm>=1.98.0",
    # AWS Bedrock
    # 智谱 AI
    # 通义千问
    # 数据校验
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # HTTP 客户端
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    # JSON 路径断言
    "jsonpath-ng>=1.6.0",
    # Excel 报告
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    # 报告与模板
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
    # 配置管理
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    # 日志与可观测性
    "structlog>=24.0.0",
    "langsmith>=0.1.0",
    # 异步控制
    "asyncio-throttle>=1.0.0",
    # 数据库
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # 工具库
    "python-dateutil>=2.8.0",
    "json-repair>=0.60.1",
]

# ----------------------------------------------------------------------------
# 可选依赖分组（pip install -e ".[dev,test]"）
# ----------------------------------------------------------------------------
[project.optional-dependencies]
# 开发工具：lint、类型检查、git hooks
dev = [
    "ruff>=0.4.0",                   # 代码检查 & 格式化
    "mypy>=1.10.0",                  # 静态类型检查
    "pre-commit>=3.7.0",            # Git 提交前钩子
    "detect-secrets>=1.5",
]
# 测试工具
test = [
    "pytest>=8.0.0",                 # 测试框架
    "pytest-cov>=5.0.0",            # 覆盖率插件
    "pytest-asyncio>=0.23.0",       # 异步测试支持
    "pytest-mock>=3.14.0",          # Mock 增强
    "pytest-xdist>=3.5.0",         # 并行测试
    "pytest-timeout>=2.3.0",       # 测试超时控制
]

# ----------------------------------------------------------------------------
# 项目链接（显示在 PyPI 页面）
# ----------------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/cmrhyq/TestAgents"
Repository = "https://github.com/cmrhyq/TestAgents"
Issues = "https://github.com/cmrhyq/TestAgents/issues"

# ----------------------------------------------------------------------------
# Hatch 构建配置
# ----------------------------------------------------------------------------
[tool.hatch.version]
path = "src/__init__.py"             # 从 __version__ 变量读取版本号

[tool.hatch.build.targets.wheel]
packages = ["src"]                   # wheel 包中包含的 Python 包

# ----------------------------------------------------------------------------
# Ruff 配置（代码检查 & 格式化）
# 文档：https://docs.astral.sh/ruff/configuration/
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"             # 目标 Python 版本
line-length = 120                    # 最大行长度

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes
    "W",    # pycodestyle 警告
    "I",    # isort（导入排序）
    "N",    # pep8-naming（命名规范）
    "UP",   # pyupgrade（Python 版本升级建议）
    "B",    # flake8-bugbear（常见 bug 模式）
    "A",    # flake8-builtins（内置名称遮蔽）
    "SIM",  # flake8-simplify（代码简化建议）
]
ignore = [
    "E501",   # 行长度由 formatter 控制，lint 不重复检查
    "B008",   # FastAPI Depends/File/Query 在默认参数中调用是框架惯用模式
    "SIM108", # 三元表达式在复杂场景下可读性不如 if-else
]

[tool.ruff.lint.per-file-ignores]
"src/utils/http/request.py" = ["A004"]  # requests.ConnectionError 遮蔽内置名不可避免

[tool.ruff.lint.isort]
known-first-party = ["src"]          # 项目自身模块，排序时归入第一方

# ----------------------------------------------------------------------------
# Pytest 配置
# 文档：https://docs.pytest.org/en/stable/reference/customize.html
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]                # 测试文件搜索路径
pythonpath = [".", "src"]            # 项目根目录与 src 均加入 sys.path（代码同时使用 src. 前缀与裸 data. 导入）
asyncio_mode = "auto"               # 自动识别异步测试函数
addopts = [
    "-v",                            # 详细输出
    "--strict-markers",              # 未注册的 marker 报错
    "--tb=short",                    # 简短的 traceback
    "-q",                            # 安静模式（与 -v 配合输出关键信息）
]
markers = [
    "unit: 单元测试（快速，无外部依赖）",
    "integration: 集成测试（可能依赖外部服务）",
    "slow: 耗时较长的测试",
    "llm: 需要真实 LLM API 调用的测试",
]

# ----------------------------------------------------------------------------
# Coverage 配置（测试覆盖率）
# 文档：https://coverage.readthedocs.io/en/latest/config.html
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]                     # 统计覆盖率的源码目录
omit = ["tests/*", "**/migration/*"] # 排除测试代码和迁移脚本
branch = true                        # 启用分支覆盖率

[tool.coverage.report]
show_missing = true                  # 显示未覆盖的行号
skip_empty = true                    # 跳过空文件
fail_under = 30                      # 覆盖率低于此值时 CI 失败
exclude_lines = [                    # 这些行不计入覆盖率统计
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
