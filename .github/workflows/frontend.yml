# ============================================================================
# GitHub Actions CI — Frontend (React + TypeScript)
# Triggered on changes to frontend/ directory.
# Jobs: lint, type-check, build
# ============================================================================

name: Frontend CI

on:
  push:
    branches: ["*"]
    paths: ["frontend/**"]
  pull_request:
    branches: [main]
    paths: ["frontend/**"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src/

      - name: Prettier check
        run: npx prettier --check 'src/**/*.{ts,tsx,css,json}'

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
