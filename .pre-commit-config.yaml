# Pre-commit hooks for LLMTestAgent monorepo (backend + frontend).
#
# Bootstrap (run once after `git clone`):
#     cd backend && uv sync --extra dev && cd ..
#     cd frontend && npm install && cd ..
#     cd backend && uv run pre-commit install
#
# All hooks are dispatched from the repo root. Python tools run via
# `uv run --directory backend` so they resolve the backend venv while
# receiving repo-root-relative file paths. Frontend tools run inside
# frontend/ via `bash -c 'cd frontend && ...'`.

# Global exclude: never let any hook touch these heavy/generated paths.
exclude: |
  (?x)^(
      frontend/node_modules/.*|
      frontend/dist/.*|
      backend/\.venv/.*
  )$

repos:
  # -------------------------------------------------------------------
  # Generic hygiene
  # -------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^(backend/tests/fixtures/.*\.json|frontend/tsconfig\..*\.json)$
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # -------------------------------------------------------------------
  # Secret scanning — gitleaks (manual stage only; needs public internet)
  # -------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [manual]

  # -------------------------------------------------------------------
  # Secret scanning — detect-secrets (baseline-aware, always on)
  # -------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - "backend/.secrets.baseline"
        exclude: |
          (?x)^(
              backend/uv\.lock|
              backend/\.secrets\.baseline|
              backend/tests/fixtures/.*\.json|
              frontend/package-lock\.json
          )$

  # -------------------------------------------------------------------
  # Python: Ruff lint + format (runs inside backend/)
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, --fix)
        entry: bash -c 'cd backend && uv run ruff check --fix --force-exclude "${@/#backend\//}"' --
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: bash -c 'cd backend && uv run ruff format --force-exclude "${@/#backend\//}"' --
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true

  # -------------------------------------------------------------------
  # Python: mypy type check (runs inside backend/)
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend/src/)
        entry: bash -c 'cd backend && uv run mypy --ignore-missing-imports --no-strict-optional src/'
        language: system
        types: [python]
        files: ^backend/src/
        require_serial: true
        pass_filenames: false

  # -------------------------------------------------------------------
  # Frontend: ESLint
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint --fix "${@/#frontend\//}"' --
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        require_serial: true

  # -------------------------------------------------------------------
  # Frontend: Prettier
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "${@/#frontend\//}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|json|html)$
        exclude: ^frontend/(node_modules|dist)/
        require_serial: true

  # -------------------------------------------------------------------
  # Frontend: TypeScript type check
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: tsc
        name: tsc (frontend type check)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
        require_serial: true

  # -------------------------------------------------------------------
  # Sanity: ensure backend/uv.lock is tracked
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ensure-uv-lock-tracked
        name: ensure uv.lock is tracked
        entry: backend/scripts/ensure-uv-lock-tracked.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # # -------------------------------------------------------------------
  # # Markdown lint
  # # -------------------------------------------------------------------
  # - repo: local
  #   hooks:
  #     - id: markdownlint-cli2
  #       name: markdownlint-cli2 (--fix)
  #       entry: npx --yes markdownlint-cli2 --fix
  #       language: system
  #       types: [markdown]
  #       require_serial: true

  # -------------------------------------------------------------------
  # Custom credential / personal-data tripwire
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: legacy-tripwire
        name: legacy-tripwire (.githooks/pre-commit credential scan)
        entry: bash .githooks/pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
